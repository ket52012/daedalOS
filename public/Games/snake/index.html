<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a2e1a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px;color:#e8f5e9;user-select:none}
h1{font-size:30px;margin:8px 0}
.bar{display:flex;gap:12px;margin:8px 0;align-items:center}
.pill{background:#2d4a2d;border-radius:8px;padding:6px 16px;font-size:16px}
button{background:#66bb6a;color:#fff;border:none;border-radius:8px;padding:8px 20px;font-size:15px;cursor:pointer}
button:active{filter:brightness(.9)}
#cv{background:#0d1a0d;border-radius:10px;border:3px solid #2d4a2d;touch-action:none;max-width:94vw}
.hint{margin-top:10px;font-size:13px;color:#a5c8a5;text-align:center;line-height:1.8}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:6px;margin-top:12px}
.pad button{background:#2d4a2d;font-size:22px;border-radius:10px;padding:0}
#msg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10}
#msg div{font-size:30px}
</style>
</head>
<body>
<h1>🐍 贪吃蛇</h1>
<div class="bar">
<div class="pill">分数 <b id="sc">0</b></div>
<div class="pill">最高 <b id="bs">0</b></div>
<button onclick="start()">▶ 开始</button>
</div>
<canvas id="cv" width="400" height="400"></canvas>
<div class="pad">
<button style="grid-column:2" onclick="turn(0,-1)">⬆</button>
<button style="grid-column:1;grid-row:2" onclick="turn(-1,0)">⬅</button>
<button style="grid-column:3;grid-row:2" onclick="turn(1,0)">➡</button>
<button style="grid-column:2;grid-row:3" onclick="turn(0,1)">⬇</button>
</div>
<div class="hint">方向键 / WASD / 滑动 / 按钮控制<br>吃豆变长，别撞墙也别咬到自己</div>
<div id="msg"><div id="mt">游戏结束</div><button onclick="start()">再来一局</button></div>
<script>
const N=20,S=20,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let snake,dir,nd,food,score=0,best=+(localStorage.getItem('snakeb')||0),tm=null,speed=140;
document.getElementById('bs').textContent=best;
function start(){snake=[[10,10],[9,10],[8,10]];dir=[1,0];nd=[1,0];score=0;speed=140;document.getElementById('sc').textContent='0';document.getElementById('msg').style.display='none';putFood();clearInterval(tm);tm=setInterval(tick,speed)}
function putFood(){while(true){const x=Math.random()*N|0,y=Math.random()*N|0;if(!snake.some(s=>s[0]===x&&s[1]===y)){food=[x,y];return}}}
function turn(x,y){if(dir[0]+x===0&&dir[1]+y===0)return;nd=[x,y]}
function tick(){dir=nd;const h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];
if(h[0]<0||h[0]>=N||h[1]<0||h[1]>=N||snake.some(s=>s[0]===h[0]&&s[1]===h[1])){clearInterval(tm);if(score>best){best=score;localStorage.setItem('snakeb',best);document.getElementById('bs').textContent=best}document.getElementById('mt').textContent=`💀 游戏结束，得分 ${score}`;document.getElementById('msg').style.display='flex';return}
snake.unshift(h);
if(h[0]===food[0]&&h[1]===food[1]){score+=10;document.getElementById('sc').textContent=score;putFood();if(speed>70&&score%50===0){speed-=10;clearInterval(tm);tm=setInterval(tick,speed)}}else snake.pop();
draw()}
function draw(){ctx.fillStyle='#0d1a0d';ctx.fillRect(0,0,400,400);ctx.fillStyle='#ff5252';ctx.beginPath();ctx.arc(food[0]*S+S/2,food[1]*S+S/2,S/2-2,0,7);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#9ccc65':'#7cb342';ctx.fillRect(s[0]*S+1,s[1]*S+1,S-2,S-2)});if(snake[0]){ctx.fillStyle='#1a2e1a';const h=snake[0];ctx.fillRect(h[0]*S+5,h[1]*S+6,4,4);ctx.fillRect(h[0]*S+11,h[1]*S+6,4,4)}}
document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'||k==='w')turn(0,-1);else if(k==='ArrowDown'||k==='s')turn(0,1);else if(k==='ArrowLeft'||k==='a')turn(-1,0);else if(k==='ArrowRight'||k==='d')turn(1,0);else return;e.preventDefault()});
let sx,sy;cv.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<15&&Math.abs(dy)<15)return;Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1);e.preventDefault()});
draw();
</script>
</body>
</html>
