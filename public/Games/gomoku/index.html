<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>五子棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#e8d5a3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px;color:#5d4037;user-select:none}
h1{font-size:30px;margin:8px 0}
.bar{display:flex;gap:10px;margin:8px 0;align-items:center}
.pill{background:#d7bd8a;border-radius:8px;padding:6px 14px;font-size:15px}
button{background:#8d6e63;color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:15px;cursor:pointer}
button:active{filter:brightness(.9)}
#cv{background:#e8c97e;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.25);touch-action:manipulation;max-width:94vw;cursor:pointer}
.hint{margin-top:10px;font-size:13px;color:#8d6e63;text-align:center;line-height:1.8}
#msg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10}
#msg div{font-size:32px;color:#fff}
</style>
</head>
<body>
<h1>⚫ 五子棋</h1>
<div class="bar">
<div class="pill" id="st">你是黑子，先手</div>
<button onclick="init()">🔄 重开</button>
<button onclick="mode=!mode;init();this.textContent=mode?'👥 双人':'🤖 人机'">🤖 人机</button>
</div>
<canvas id="cv" width="450" height="450"></canvas>
<div class="hint">黑子先手，横竖斜连成五子即胜<br>人机模式：电脑执白子</div>
<div id="msg"><div id="mt"></div><button onclick="init()">再来一局</button></div>
<script>
const N=15,P=30,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let b,turn,over,mode=false,lock=false;
function init(){b=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;lock=false;document.getElementById('msg').style.display='none';document.getElementById('st').textContent=mode?'你是黑子，先手':'黑子先手';draw()}
function draw(){ctx.fillStyle='#e8c97e';ctx.fillRect(0,0,450,450);ctx.strokeStyle='#8d6e63';ctx.lineWidth=1;for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(P,P+i*P);ctx.lineTo(P+(N-1)*P,P+i*P);ctx.stroke();ctx.beginPath();ctx.moveTo(P+i*P,P);ctx.lineTo(P+i*P,P+(N-1)*P);ctx.stroke()}
[[3,3],[11,3],[3,11],[11,11],[7,7]].forEach(p=>{ctx.fillStyle='#5d4037';ctx.beginPath();ctx.arc(P+p[0]*P,P+p[1]*P,4,0,7);ctx.fill()});
for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x]){ctx.fillStyle=b[y][x]===1?'#212121':'#fafafa';ctx.beginPath();ctx.arc(P+x*P,P+y*P,12,0,7);ctx.fill();ctx.strokeStyle='#8d6e63';ctx.stroke()}}
function win(x,y,v){const d=[[1,0],[0,1],[1,1],[1,-1]];for(const[dx,dy]of d){let n=1,i=1;while(b[y+dy*i]?.[x+dx*i]===v){n++;i++}i=1;while(b[y-dy*i]?.[x-dx*i]===v){n++;i++}if(n>=5)return true}return false}
function put(x,y){if(over||b[y][x]||(mode&&turn===-1&&lock))return;b[y][x]=turn;draw();if(win(x,y,turn)){over=true;setTimeout(()=>show(turn===1?'⚫ 黑子胜！':'⚪ 白子胜！'),50);return}turn=-turn;if(mode&&turn===-1){lock=true;setTimeout(()=>{ai();lock=false},400)}}
function show(t){document.getElementById('mt').textContent=t;document.getElementById('msg').style.display='flex'}
function score(x,y,v){if(b[y][x])return -1;let s=0;const d=[[1,0],[0,1],[1,1],[1,-1]];for(const[dx,dy]of d){let n=1,open=0;for(const sgn of[1,-1]){let i=1;while(b[y+dy*i*sgn]?.[x+dx*i*sgn]===v){n++;i++}if(b[y+dy*i*sgn]?.[x+dx*i*sgn]===0)open++}s+=n*10+open*3;if(n>=5)s+=100000}return s}
function ai(){if(over)return;let bx=7,by=7,bs=-1;for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(b[y][x])continue;const s=Math.max(score(x,y,-1)*1.1,score(x,y,1));if(s>bs){bs=s;bx=x;by=y}}b[by][bx]=-1;draw();if(win(bx,by,-1)){over=true;setTimeout(()=>show('⚪ 白子胜！'),50);return}turn=1}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),k=450/r.width;const gx=Math.round((e.clientX-r.left)/k/P-1),gy=Math.round((e.clientY-r.top)/k/P-1);if(gx>=0&&gx<N&&gy>=0&&gy<N)put(gx,gy)});
init();
</script>
</body>
</html>
