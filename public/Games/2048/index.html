<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#faf8ef;font-family:"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;color:#776e65;user-select:none}
h1{font-size:42px;margin:8px 0 4px}
.bar{display:flex;gap:10px;margin:10px 0;align-items:center}
.score{background:#bbada0;color:#fff;border-radius:6px;padding:6px 14px;text-align:center;font-size:13px}
.score b{display:block;font-size:20px}
button{background:#8f7a66;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:15px;cursor:pointer}
button:active{background:#7f6a56}
#grid{background:#bbada0;border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(4,72px);grid-template-rows:repeat(4,72px);gap:10px;touch-action:none}
.cell{background:#cdc1b4;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.hint{margin-top:12px;font-size:13px;color:#a29383;text-align:center;line-height:1.8}
#over{position:fixed;inset:0;background:rgba(238,228,218,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:10}
#over div{font-size:32px;font-weight:700}
</style>
</head>
<body>
<h1>2048</h1>
<div class="bar">
<div class="score">分数<b id="s">0</b></div>
<div class="score">最高<b id="b">0</b></div>
<button onclick="init()">新游戏</button>
</div>
<div id="grid"></div>
<div class="hint">方向键 / WASD / 滑动屏幕<br>合并相同数字，冲到 2048！</div>
<div id="over"><div id="ot">游戏结束</div><button onclick="init()">再来一局</button></div>
<script>
let g,score=0,best=+(localStorage.getItem('g2048b')||0);
const grid=document.getElementById('grid'),cells=[];
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='cell';grid.appendChild(d);cells.push(d)}
const COLORS={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
function draw(){cells.forEach((c,i)=>{const v=g[i];c.textContent=v||'';c.style.background=v?(COLORS[v]||'#3c3a32'):'#cdc1b4';c.style.color=v>4?'#f9f6f2':'#776e65';c.style.fontSize=v>512?'20px':'28px'});document.getElementById('s').textContent=score;document.getElementById('b').textContent=best}
function add(){const e=[];g.forEach((v,i)=>{if(!v)e.push(i)});if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function slide(row){let a=row.filter(x=>x),s=0;for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;s+=a[i];a.splice(i+1,1)}}while(a.length<4)a.push(0);return[a,s]}
function move(dx,dy){let moved=false,ns=0,ng=g.slice();for(let i=0;i<4;i++){let idx=[],row=[];for(let j=0;j<4;j++){const x=dx?j:(dy>0?3-j:j),y=dy?i:(dx>0?3-i:i);const p=y*4+x;idx.push(p);row.push(g[p])}const[r,s]=slide(row);ns+=s;r.forEach((v,k)=>{if(ng[idx[k]]!==v)moved=true;ng[idx[k]]=v})}if(!moved)return;g=ng;score+=ns;if(score>best){best=score;localStorage.setItem('g2048b',best)}add();draw();check()}
function check(){if(g.includes(0))return;for(let y=0;y<4;y++)for(let x=0;x<4;x++){const v=g[y*4+x];if((x<3&&g[y*4+x+1]===v)||(y<3&&g[(y+1)*4+x]===v))return}over(false)}
function over(win){document.getElementById('ot').textContent=win?'🎉 你赢了！':'游戏结束';document.getElementById('over').style.display='flex'}
function init(){g=Array(16).fill(0);score=0;document.getElementById('over').style.display='none';add();add();draw()}
document.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'||k==='w')move(0,-1);else if(k==='ArrowDown'||k==='s')move(0,1);else if(k==='ArrowLeft'||k==='a')move(-1,0);else if(k==='ArrowRight'||k==='d')move(1,0);else return;e.preventDefault()});
let sx,sy;grid.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
grid.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;Math.abs(dx)>Math.abs(dy)?move(dx>0?1:-1,0):move(0,dy>0?1:-1);e.preventDefault()});
init();
</script>
</body>
</html>
